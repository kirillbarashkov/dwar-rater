name: Deploy to Cloud.ru

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Type "DEPLOY" to confirm production deployment'
        required: true
        type: string
      bump_part:
        description: 'Version bump part for hotfix releases (always applied when dispatching)'
        required: false
        default: 'patch'
        type: choice
        options: [patch, minor, major]

# Avoid infinite loop: release commits ([skip ci]) must not re-trigger
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dwar
          POSTGRES_PASSWORD: change-me-in-production
          POSTGRES_DB: dwar_rater
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U dwar && break
            echo "Waiting for PostgreSQL... ($i)"
            sleep 2
          done

      - name: Backend tests
        env:
          TEST_DATABASE_URL: postgresql://dwar:change-me-in-production@localhost:5432/dwar_rater_test
        run: |
          cd backend
          pip install -r requirements.txt
          python -m pytest -v

  validate-deploy-input:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Confirm deployment
        run: |
          if [ "${{ github.event.inputs.confirm_deploy }}" != "DEPLOY" ]; then
            echo "Deployment cancelled: input must be 'DEPLOY'"
            exit 1
          fi

  deploy:
    needs: [test, validate-deploy-input]
    if: always() && needs.test.result == 'success' && (github.event_name == 'push' || needs.validate-deploy-input.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine bump part
        id: bump
        run: |
          PART="patch"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PART="${{ github.event.inputs.bump_part }}"
          else
            # PR-label driven: bump:major / bump:minor on the merged PR containing this sha
            LABELS=$(curl -sf -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.groot-preview+json" \
              "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
              | jq -r '.[0].labels[].name' 2>/dev/null || true)
            if echo "$LABELS" | grep -qx 'bump:major'; then PART="major"; fi
            if echo "$LABELS" | grep -qx 'bump:minor'; then PART="minor"; fi
          fi
          echo "part=$PART" >> "$GITHUB_OUTPUT"

      - name: Compute release version
        id: ver
        run: |
          OLD=$(cat VERSION | tr -d '[:space:]')
          PART="${{ steps.bump.outputs.part }}"
          IFS='.' read -r MA MI PA <<< "$OLD"
          case "$PART" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            *)     PA=$((PA+1)) ;;
          esac
          NEW="$MA.$MI.$PA"
          GIT_HASH=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M UTC')
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "git_hash=$GIT_HASH" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "Deploying v$OLD → image will report v$NEW (bump: $PART)"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          APP_VERSION: ${{ steps.ver.outputs.new }}
          APP_GIT_HASH: ${{ steps.ver.outputs.git_hash }}
          APP_BRANCH: main
          APP_BUILD_DATE: ${{ steps.ver.outputs.build_date }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          envs: APP_VERSION,APP_GIT_HASH,APP_BRANCH,APP_BUILD_DATE
          script: |
            cd ~/dwar-rater
            git pull origin main
            # Release notes: generate from commits since the last deployed tag
            # BEFORE building, so the file lands inside the backend image.
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            {
              echo "# v${APP_VERSION}"
              echo ""
              if [ -n "$LAST_TAG" ]; then
                LOG=$(git log --no-merges --pretty=format:'%s' "${LAST_TAG}..HEAD" | grep -v '^chore(release)' || true)
                FEATS=$(echo "$LOG" | grep -i '^feat' || true)
                FIXES=$(echo "$LOG" | grep -i '^fix' || true)
                OTHER=$(echo "$LOG" | grep -iv '^\(feat\|fix\|chore(release)\)' || true)
                if [ -n "$FEATS" ]; then echo "## Новое"; echo "$FEATS" | while IFS= read -r l; do echo "- $l"; done; echo ""; fi
                if [ -n "$FIXES" ]; then echo "## Исправления"; echo "$FIXES" | while IFS= read -r l; do echo "- $l"; done; echo ""; fi
                if [ -n "$OTHER" ]; then echo "## Прочее"; echo "$OTHER" | while IFS= read -r l; do echo "- $l"; done; echo ""; fi
              else
                echo "- Релиз v${APP_VERSION}"
              fi
            } > backend/RELEASE_NOTES.md
            # Build args reach docker-compose via env (${APP_VERSION:-dev} etc.)
            export APP_VERSION APP_GIT_HASH APP_BRANCH APP_BUILD_DATE
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f

      - name: Wait for health check (via SSH inside VM)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            for i in $(seq 1 20); do
              if docker compose -f ~/dwar-rater/docker-compose.prod.yml exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')" 2>/dev/null; then
                echo "Backend is healthy!"
                exit 0
              fi
              echo "Waiting... ($i/20)"
              sleep 10
            done
            echo "Health check failed after 200s"
            echo "=== Backend logs (last 50 lines) ==="
            docker compose -f ~/dwar-rater/docker-compose.prod.yml logs --tail 50 backend 2>&1 || true
            exit 1

      - name: Commit release bump and tag
        run: |
          NEW="${{ steps.ver.outputs.new }}"
          OLD="${{ steps.ver.outputs.old }}"
          TAG="v${NEW}"
          # Idempotency: if tag already exists, this run is a re-run — skip silently
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — skipping release commit"
            exit 0
          fi
          echo "$NEW" > VERSION
          # Sync frontend package.json with the canonical VERSION (sync-point, do not hand-edit)
          jq --arg v "$NEW" '.version = $v' frontend/package.json > frontend/package.json.tmp \
            && mv frontend/package.json.tmp frontend/package.json
          # Release notes: commits since the previous tag, grouped by type
          PREV_TAG="v${OLD}"
          {
            echo "# v${NEW}"
            echo ""
            if git rev-parse "refs/tags/${PREV_TAG}" >/dev/null 2>&1; then
              LOG=$(git log --no-merges --pretty=format:'%s' "${PREV_TAG}..HEAD" | grep -v '^chore(release)')
              FEATS=$(echo "$LOG" | grep -i '^feat' || true)
              FIXES=$(echo "$LOG" | grep -i '^fix' || true)
              OTHER=$(echo "$LOG" | grep -iv '^\(feat\|fix\|chore(release)\)' || true)
              if [ -n "$FEATS" ]; then
                echo "## Новое"
                echo "$FEATS" | while IFS= read -r line; do echo "- $line"; done
                echo ""
              fi
              if [ -n "$FIXES" ]; then
                echo "## Исправления"
                echo "$FIXES" | while IFS= read -r line; do echo "- $line"; done
                echo ""
              fi
              if [ -n "$OTHER" ]; then
                echo "## Прочее"
                echo "$OTHER" | while IFS= read -r line; do echo "- $line"; done
                echo ""
              fi
            else
              echo "- Релиз ${TAG}"
            fi
          } > RELEASE_NOTES.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION frontend/package.json RELEASE_NOTES.md
          git commit -m "chore(release): ${TAG} [skip ci]" || echo "Nothing to commit"
          git tag -a "${TAG}" -m "Release ${TAG} (auto-deployed from v${OLD}, bump: ${{ steps.bump.outputs.part }})"
          git push origin main --follow-tags

      - name: Notify on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            echo "=== Deployment failed — collecting diagnostics ==="
            docker compose -f ~/dwar-rater/docker-compose.prod.yml ps 2>&1 || true
            echo "=== Backend logs (last 80 lines) ==="
            docker compose -f ~/dwar-rater/docker-compose.prod.yml logs --tail 80 backend 2>&1 || true
            echo "=== Postgres logs (last 20 lines) ==="
            docker compose -f ~/dwar-rater/docker-compose.prod.yml logs --tail 20 postgres 2>&1 || true

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Deployment failed! Check logs for diagnostics from SSH step."
          echo "Last known good commit: ${{ github.sha }}"
