# A62: nginx работает под непривилегированным пользователем `nginx` (uid 101).
# Штатный /etc/nginx/nginx.conf рассчитан на master под root: pid-файл и временные
# каталоги лежат там, куда обычный пользователь писать не может. Здесь те же
# директивы, но всё изменяемое — в /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Буферы запросов/ответов: по умолчанию nginx создаёт их в /var/cache/nginx.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
