server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html names the hashed bundle, so a cached copy keeps serving the
    # previous UI after a deploy (users report "I don't see the update").
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Hashed assets are immutable: the name changes together with the content.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /apidocs {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
    }
}
