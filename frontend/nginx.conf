# A41: токен SSE приходит query-параметром (?token=...), а стандартный формат
# access-log пишет строку запроса целиком — сырой токен сессии оставался в
# /var/log/nginx/access.log на VM. Этот формат логирует путь БЕЗ аргументов:
# диагностика по путям и кодам сохраняется, секрет в лог не попадает.
# Директива log_format допустима здесь: файл подключается внутрь http{} (conf.d).
log_format no_args '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';

server {
    # A62: непривилегированный nginx не может занять порт < 1024.
    # Внешний порт остаётся 80 — его публикует docker compose ("80:8080").
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html names the hashed bundle, so a cached copy keeps serving the
    # previous UI after a deploy (users report "I don't see the update").
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Hashed assets are immutable: the name changes together with the content.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ответы API — это JSON со всей историей казны (15 000 операций ≈ 3,5 МБ).
    # Без сжатия они уходят по сети как есть, и вкладка ждёт секунды.
    # gzip_proxied обязателен: по умолчанию nginx проксированные ответы не сжимает.
    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    # Без этого промежуточный кэш может отдать сжатый ответ клиенту, который его
    # не понимает: nginx обязан пометить ответ как зависящий от Accept-Encoding.
    gzip_vary on;

    location /api/ {
        # A41: без этого включается формат по умолчанию, а он пишет $request_uri
        # (с query-строкой), то есть токен SSE.
        access_log /dev/stdout no_args;
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /apidocs {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
    }
}
