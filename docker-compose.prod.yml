services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: dwar_rater_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dwar_rater}
      # A13: сколько дней хранить дампы. Без этой строки переменная из .env
      # не доходила до контейнера, и ротация молча не работала.
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      POSTGRES_USER: ${POSTGRES_USER:-dwar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backups
    # A38: без healthcheck бэкенд стартовал, как только поднялся КОНТЕЙНЕР
    # postgres, а не когда БД принимает соединения. Миграции падали на
    # неготовой БД и молча уходили в create_all() (см. A6).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dwar} -d ${POSTGRES_DB:-dwar_rater}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dwar-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        APP_GIT_HASH: ${APP_GIT_HASH:-unknown}
        APP_BRANCH: ${APP_BRANCH:-unknown}
        APP_BUILD_DATE: ${APP_BUILD_DATE:-unknown}
    container_name: dwar_rater_backend
    # A39: общий том бэкапов с postgres — бэкап из админки переживает пересоздание
    # контейнера и виден тем же инструментам, что и ежечасный cron-дамп.
    volumes:
      - postgres_backups:/backups
    restart: unless-stopped
    # A62: процесс под uid 10001 (см. backend/Dockerfile) и без новых привилегий.
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      AUTH_ENABLED: "true"
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS: ${ADMIN_PASS}
      RATE_LIMIT_MAX: "100"
      RATE_LIMIT_WINDOW: "60"
      # A6: в проде падение миграции — фатальная ошибка старта, а не тихий
      # create_all() по моделям (расхождение схемы всплывёт уже в бою).
      STRICT_MIGRATIONS: "true"
      CORS_ORIGINS: ${CORS_ORIGINS}
    # A38: healthcheck бэкенда — чтобы деплой и компоуз видели готовность
    # приложения, а не только запущенный процесс.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - dwar-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: dwar_rater_frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_started
    # A62: внутри контейнера nginx слушает 8080 (непривилегированный порт),
    # снаружи остаётся 80.
    ports:
      - "80:8080"
    networks:
      - dwar-net

volumes:
  postgres_data:
    name: dwar-rater_postgres_data
  postgres_backups:
    name: dwar-rater_postgres_backups

networks:
  dwar-net:
    driver: bridge
